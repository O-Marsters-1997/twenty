schema:
  - invitation.graphqls
exec:
  filename: generated.go
  package: invitationgql
model:
  filename: models_gen.go
  package: invitationgql
resolver:
  layout: single-file
  filename: resolver.go
  package: invitationgql
  type: Resolver
models:
  UUID:
    model: github.com/99designs/gqlgen/graphql.String
  DateTime:
    model: github.com/99designs/gqlgen/graphql.String
  WorkspaceInvitation:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/invitation/store.Invitation
  ApprovedAccessDomain:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/invitation/store.ApprovedDomain
  DeleteApprovedAccessDomainInput:
    model: map[string]interface{}
