schema:
  - person.graphqls
  - company.graphqls
  - opportunity.graphqls
  - aggregate.graphqls
exec:
  filename: generated.go
  package: recordsgql
model:
  filename: models_gen.go
  package: recordsgql
resolver:
  layout: single-file
  filename: resolver.go
  package: recordsgql
  type: Resolver
models:
  UUID:
    model: github.com/99designs/gqlgen/graphql.String
  ID:
    model: github.com/99designs/gqlgen/graphql.ID
  Position:
    model: github.com/99designs/gqlgen/graphql.Float
  DateTime:
    model: github.com/99designs/gqlgen/graphql.Time
  ConnectionCursor:
    model: github.com/99designs/gqlgen/graphql.String
  Cursor:
    model: github.com/99designs/gqlgen/graphql.String
  FilterMap:
    model: github.com/99designs/gqlgen/graphql.Map
  OrderByMap:
    model: github.com/99designs/gqlgen/graphql.Map
  PersonFilterInput:
    model: map[string]interface{}
  PersonOrderByInput:
    model: map[string]interface{}
  PersonOrderByWithGroupByInput:
    model: map[string]interface{}
  PersonGroupByInput:
    model: map[string]interface{}
  CompanyFilterInput:
    model: map[string]interface{}
  CompanyOrderByInput:
    model: map[string]interface{}
  CompanyOrderByWithGroupByInput:
    model: map[string]interface{}
  CompanyGroupByInput:
    model: map[string]interface{}
  OpportunityFilterInput:
    model: map[string]interface{}
  OpportunityOrderByInput:
    model: map[string]interface{}
  OpportunityOrderByWithGroupByInput:
    model: map[string]interface{}
  OpportunityGroupByInput:
    model: map[string]interface{}
  JSON:
    model: github.com/99designs/gqlgen/graphql.Any
