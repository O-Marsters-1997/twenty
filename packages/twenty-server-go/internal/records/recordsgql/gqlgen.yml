schema:
  - person.graphqls
  - aggregate.graphqls
  - timelineactivity.graphqls
  - attachment.graphqls
exec:
  filename: generated.go
  package: recordsgql
model:
  filename: models_gen.go
  package: recordsgql
models:
  UUID:
    model: github.com/99designs/gqlgen/graphql.String
  ID:
    model: github.com/99designs/gqlgen/graphql.ID
  Position:
    model: github.com/99designs/gqlgen/graphql.Float
  DateTime:
    model: github.com/99designs/gqlgen/graphql.Time
  ConnectionCursor:
    model: github.com/99designs/gqlgen/graphql.String
  Cursor:
    model: github.com/99designs/gqlgen/graphql.String
  FilterMap:
    model: github.com/99designs/gqlgen/graphql.Map
  OrderByMap:
    model: github.com/99designs/gqlgen/graphql.Map
  PersonFilterInput:
    model: map[string]interface{}
  PersonOrderByInput:
    model: map[string]interface{}
  PersonOrderByWithGroupByInput:
    model: map[string]interface{}
  PersonGroupByInput:
    model: map[string]interface{}
  TimelineActivityFilterInput:
    model: map[string]interface{}
  TimelineActivityOrderByInput:
    model: map[string]interface{}
  TimelineActivityOrderByWithGroupByInput:
    model: map[string]interface{}
  TimelineActivityGroupByInput:
    model: map[string]interface{}
  AttachmentFilterInput:
    model: map[string]interface{}
  AttachmentOrderByInput:
    model: map[string]interface{}
  AttachmentOrderByWithGroupByInput:
    model: map[string]interface{}
  AttachmentGroupByInput:
    model: map[string]interface{}
  JSON:
    model: github.com/99designs/gqlgen/graphql.Any
