schema:
  - person.graphqls
  - aggregate.graphqls
  - workspaceMember.graphqls
  - dashboard.graphqls
exec:
  filename: generated.go
  package: recordsgql
model:
  filename: models_gen.go
  package: recordsgql
models:
  UUID:
    model: github.com/99designs/gqlgen/graphql.String
  ID:
    model: github.com/99designs/gqlgen/graphql.ID
  Position:
    model: github.com/99designs/gqlgen/graphql.Float
  DateTime:
    model: github.com/99designs/gqlgen/graphql.Time
  ConnectionCursor:
    model: github.com/99designs/gqlgen/graphql.String
  Cursor:
    model: github.com/99designs/gqlgen/graphql.String
  FilterMap:
    model: github.com/99designs/gqlgen/graphql.Map
  OrderByMap:
    model: github.com/99designs/gqlgen/graphql.Map
  PersonFilterInput:
    model: map[string]interface{}
  PersonOrderByInput:
    model: map[string]interface{}
  PersonOrderByWithGroupByInput:
    model: map[string]interface{}
  PersonGroupByInput:
    model: map[string]interface{}
  WorkspaceMemberFilterInput:
    model: map[string]interface{}
  WorkspaceMemberOrderByInput:
    model: map[string]interface{}
  WorkspaceMemberOrderByWithGroupByInput:
    model: map[string]interface{}
  WorkspaceMemberGroupByInput:
    model: map[string]interface{}
  DashboardFilterInput:
    model: map[string]interface{}
  DashboardOrderByInput:
    model: map[string]interface{}
  DashboardOrderByWithGroupByInput:
    model: map[string]interface{}
  DashboardGroupByInput:
    model: map[string]interface{}
  JSON:
    model: github.com/99designs/gqlgen/graphql.Any
