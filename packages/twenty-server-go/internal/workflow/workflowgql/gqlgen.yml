schema:
  - workflow.graphqls
exec:
  filename: generated.go
  package: workflowgql
model:
  filename: models_gen.go
  package: workflowgql
resolver:
  layout: single-file
  filename: resolver.go
  package: workflowgql
  type: Resolver
models:
  UUID:
    model: github.com/99designs/gqlgen/graphql.String
  JSON:
    model: github.com/99designs/gqlgen/graphql.Any
  CoreWorkflowStatus:
    model: github.com/99designs/gqlgen/graphql.String
  CoreWorkflowVersionStatus:
    model: github.com/99designs/gqlgen/graphql.String
  WorkflowVisibility:
    model: github.com/99designs/gqlgen/graphql.String
  CoreWorkflowDTO:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/workflow/workflowgql.WorkflowDTO
  DeletedCoreWorkflowDTO:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/workflow/workflowgql.DeletedWorkflowDTO
  CoreWorkflowVersionDTO:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/workflow/workflowgql.VersionDTO
  WorkflowVersionStepChanges:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/workflow/workflowgql.StepChangesDTO
  WorkflowAction:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/workflow/workflowgql.ActionDTO
  WorkflowStepPosition:
    model: github.com/twentyhq/twenty/packages/twenty-server-go/internal/workflow/workflowgql.PositionDTO
