    model: map[string]interface{}
  DuplicateCoreWorkflowInput:
    model: map[string]interface{}
  DeleteCoreWorkflowsInput:
    model: map[string]interface{}
  DiscardCoreWorkflowDraftInput:
    model: map[string]interface{}
  CreateDraftFromCoreWorkflowVersionInput:
    model: map[string]interface{}
  CreateCoreWorkflowVersionStepInput:
    model: map[string]interface{}
  UpdateCoreWorkflowVersionStepInput:
    model: map[string]interface{}
  UpdateCoreWorkflowVersionTriggerInput:
    model: map[string]interface{}
  DeleteCoreWorkflowVersionStepInput:
    model: map[string]interface{}
  DuplicateCoreWorkflowVersionStepInput:
    model: map[string]interface{}
  CreateCoreWorkflowVersionEdgeInput:
    model: map[string]interface{}
  DeleteCoreWorkflowVersionEdgeInput:
    model: map[string]interface{}
  UpdateCoreWorkflowVersionPositionsInput:
    model: map[string]interface{}
