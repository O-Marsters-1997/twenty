language: typescript
layer: library

dependsOn: ['twenty-shared']

fileGroups:
  sources:
    - 'src/**/*'
    - 'design-tokens/**/*'
    - 'scripts/**/*'
    - 'test-utilities/**/*'
    - 'generated/**/*'
    - '.storybook/**/*'
    - 'package.json'
    - 'tsconfig*.json'
    - 'vite.config*.ts'
    - 'vitest.config.ts'
    - 'setupTests.ts'

tasks:
  build:
    command: npx vite build
    inputs:
      - 'src/**/*'
      - '!src/**/*.{spec,test}.{ts,tsx}'
      - '!src/**/*.stories.{ts,tsx}'
      - 'design-tokens/**/*'
      - 'generated/**/*'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '/tsconfig.base.json'
    outputs: ['dist']
    options:
      cache: true

  lint:
    script: |-
      npx oxlint -c .oxlintrc.json . && (npx oxfmt --check . || (echo 'ERROR: oxfmt formatting check failed! Fix with: npx oxfmt .' && false))
    deps: ['twenty-oxlint-rules:build']
    inputs:
      [
        '@group(sources)',
        '.oxlintrc.json',
        '.prettierignore',
        '/.oxfmtrc.jsonc',
        '/packages/twenty-oxlint-rules/dist/oxlint-plugin.mjs',
      ]
    options:
      cache: true

  fmt:
    command: npx oxfmt --check src
    inputs: ['src/**/*', '.prettierignore', '/.oxfmtrc.jsonc']
    options:
      cache: true

  test:
    script: tsx packages/twenty-ui/scripts/generateBarrels.ts --check && tsx packages/twenty-ui/scripts/checkModuleOwnership.ts && node --import tsx --test packages/twenty-ui/scripts/__tests__/*.test.ts && cd packages/twenty-ui && npx vitest run --project unit
    inputs:
      [
        '@group(sources)',
        'docs/module-ownership.json',
        'docs/public-exports.json',
        '/package.json',
        '/bun.lock',
      ]
    options:
      cache: true
      runFromWorkspaceRoot: true

  generate-tokens:
    command: tsx scripts/generateThemeTokens.ts
    inputs:
      [
        'scripts/generateThemeTokens.ts',
        'design-tokens/**/*',
        '/.oxfmtrc.jsonc',
      ]
    outputs:
      - 'src/theme/themeCssVariables.ts'
      - 'src/theme/themeTypes.ts'
      - 'src/theme/internal/themeSpacing.ts'
      - 'src/theme/constants/ThemeLight.ts'
      - 'src/theme/constants/ThemeDark.ts'
      - 'src/theme/constants/ThemeCommon.ts'
      - 'src/theme/tokens.stylex.ts'
      - 'src/theme/themes.stylex.ts'
      - 'src/theme/constants.stylex.ts'
      - 'src/theme/constants/MainColorNames.ts'
      - 'src/theme/constants/Animation.ts'
      - 'src/theme/constants/GrayScaleLight.ts'
      - 'src/theme/constants/GrayScaleDark.ts'
    options:
      cache: true

  generate-check:
    command: tsx scripts/generateThemeTokens.ts --check
    inputs:
      [
        'scripts/generateThemeTokens.ts',
        'design-tokens/**/*',
        'src/theme/**/*',
        '/.oxfmtrc.jsonc',
      ]
    options:
      cache: true

  generate-barrels:
    command: tsx packages/twenty-ui/scripts/generateBarrels.ts
    inputs: ['src/**/*', 'scripts/generateBarrels.ts', 'package.json']
    outputs:
      [
        'src/index.ts',
        'src/individual-entry.ts',
        'src/**/*/index.ts',
        'package.json',
      ]
    options:
      cache: true
      runFromWorkspaceRoot: true

  generate-icon-dictionary:
    command: tsx scripts/generateIconDictionary.ts
    inputs:
      - 'scripts/generateIconDictionary.ts'
      - 'src/icon/constants/TwentyIconDictionary.ts'
      - 'src/icon/internal/generateTwentyIconDictionaryMarkdown.ts'
    outputs: ['src/icon/icon-dictionary.md']
    options:
      cache: true

  check-icon-dictionary:
    command: tsx scripts/generateIconDictionary.ts --check
    inputs:
      - 'scripts/generateIconDictionary.ts'
      - 'src/icon/constants/TwentyIconDictionary.ts'
      - 'src/icon/internal/generateTwentyIconDictionaryMarkdown.ts'
      - 'src/icon/icon-dictionary.md'
    options:
      cache: true

  size:
    command: npx size-limit
    deps: ['build']
    inputs: ['dist/**/*', '.size-limit.json']
    options:
      cache: true

  pack-size:
    command: tsx scripts/checkPackSize.ts
    deps: ['build']
    inputs: ['dist/**/*', 'package.json', 'scripts/checkPackSize.ts']
    options:
      cache: true

  knip:
    command: knip --workspace packages/twenty-ui
    deps: ['^:build', 'twenty-shared:build']
    inputs: ['@group(sources)', '/knip.json', '/package.json']
    options:
      cache: true
      runFromWorkspaceRoot: true

  storybook-build:
    command: storybook build --test
    env:
      NODE_OPTIONS: '--max-old-space-size=10240'
    inputs: ['@group(sources)', '!src/**/*.{spec,test}.{ts,tsx}']
    outputs: ['storybook-static']
    options:
      cache: true

  storybook-dev:
    command: storybook dev --port 6008
    inputs: ['@group(sources)']
    options:
      cache: false
