name: moon cache
inputs:
  key-prefix:
    required: true
outputs:
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Restore and save moon cache
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ inputs.key-prefix }}-${{ github.sha }}
        restore-keys: ${{ inputs.key-prefix }}-
        path: |
          .moon/cache/hashes
          .moon/cache/outputs
