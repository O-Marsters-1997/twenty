name: CI Server Go

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feat/go-backend-migration

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-server-go/**
        .github/workflows/ci-server-go.yaml
  generated-code:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/twenty-server-go
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/twenty-server-go/go.mod
          cache-dependency-path: packages/twenty-server-go/go.sum
      - name: Regenerate the object model, SDL and sqlc code
        run: go generate ./...
      - name: Fail on a generated diff
        run: git diff --exit-code -- . && test -z "$(git ls-files --others --exclude-standard -- .)"
  ci-server-go-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, generated-code]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
