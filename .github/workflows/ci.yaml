name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MOON_BASE: ${{ github.event.pull_request.base.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.affected.outputs.go }}
      front: ${{ steps.affected.outputs.front }}
      ui: ${{ steps.affected.outputs.ui }}
      shared: ${{ steps.affected.outputs.shared }}
      emails: ${{ steps.affected.outputs.emails }}
      utils: ${{ steps.affected.outputs.utils }}
      knip: ${{ steps.affected.outputs.knip }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/bun-install
      - id: affected
        env:
          MOON_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          everything=false
          affected=
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            everything=true
          else
            outside_projects='^(\.github|\.moon|scripts)/|^(package\.json|bun\.lock|knip\.json|tsconfig\.base\.json|jest\.preset\.js|\.oxfmtrc\.jsonc|bunfig\.toml)$'
            everything=$(npx moon query changed-files | jq --arg pattern "$outside_projects" '[.files[] | select(test($pattern))] | length > 0')
            affected=$(npx moon query affected --downstream deep | jq -r '.projects | keys[]')
          fi
          emit() {
            if [ "$everything" = true ] || printf '%s\n' "$affected" | grep -qx "$2"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi >> "$GITHUB_OUTPUT"
          }
          emit go twenty-server-go
          emit front twenty-front
          emit ui twenty-ui
          emit shared twenty-shared
          emit emails twenty-emails
          emit utils twenty-utils
          emit knip twenty-front

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/twenty-server-go/go.mod
          cache-dependency-path: packages/twenty-server-go/go.sum
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-go
      - run: npx moon run twenty-server-go:generated-check twenty-server-go:build twenty-server-go:vet twenty-server-go:test

  front-static:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-front-static
      - run: npx moon run twenty-front:reset-env twenty-front:lint twenty-front:typecheck

  front-test:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-front-test-${{ matrix.shard }}
      - run: npx moon run twenty-front:reset-env
      - run: npx moon run twenty-front:test -- --ci --maxWorkers=1 --shard=${{ matrix.shard }}/3

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-ui
      - run: npx moon run twenty-ui:lint twenty-ui:generate-check twenty-ui:typecheck twenty-ui:test

  shared-emails-utils:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.emails == 'true' || needs.changes.outputs.utils == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: install
        uses: ./.github/actions/bun-install
      - uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-shared-emails-utils
      - name: Shared lint, typecheck and test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.shared == 'true' }}
        run: |
          npx moon run twenty-oxlint-rules:build
          npx moon run twenty-shared:lint twenty-shared:typecheck twenty-shared:test
      - name: Emails build, lingui and preview
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.emails == 'true' }}
        run: |
          npx moon run twenty-emails:build twenty-emails:lingui-extract twenty-emails:lingui-compile
          npx moon run twenty-emails:start &
          SERVER_PID=$!
          sleep 20
          curl -sf http://localhost:4001/preview/test.email > /dev/null || { kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
      - name: Utils test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.utils == 'true' }}
        run: npx moon run twenty-utils:test

  knip:
    needs: changes
    if: needs.changes.outputs.knip == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/bun-install
      - uses: ./.github/actions/moon-cache
        with:
          key-prefix: moon-knip
      - run: npx moon run twenty-front:knip twenty-ui:knip --concurrency 1

  ci-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changes, go, front-static, front-test, ui, shared-emails-utils, knip]
    steps:
      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
