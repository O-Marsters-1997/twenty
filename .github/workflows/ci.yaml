name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.go_any_changed == 'true' }}
      front: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.front_any_changed == 'true' }}
      ui: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.ui_any_changed == 'true' }}
      shared: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.shared_any_changed == 'true' }}
      emails: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.emails_any_changed == 'true' }}
      utils: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.utils_any_changed == 'true' }}
      knip: ${{ github.event_name == 'push' || steps.filter.outputs.ci_any_changed == 'true' || steps.filter.outputs.knip_any_changed == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - id: filter
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45.0.9
        with:
          files_yaml: |
            ci:
              - .github/**
            go:
              - packages/twenty-server-go/**
            front:
              - package.json
              - bun.lock
              - packages/twenty-front/**
              - packages/twenty-ui/**
              - packages/twenty-shared/**
              - packages/twenty-oxlint-rules/**
            ui:
              - package.json
              - bun.lock
              - packages/twenty-ui/**
              - packages/twenty-shared/**
            shared:
              - packages/twenty-shared/**
            emails:
              - package.json
              - packages/twenty-emails/**
            utils:
              - packages/twenty-utils/**
            knip:
              - knip.json
              - nx.json
              - package.json
              - bun.lock
              - packages/twenty-front/**
              - packages/twenty-shared/**
              - packages/twenty-ui/**

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/twenty-server-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: setup
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/twenty-server-go/go.mod
          cache-dependency-path: packages/twenty-server-go/go.sum
      - name: Fail on a generated diff
        run: |
          go generate ./...
          git diff --exit-code -- . && test -z "$(git ls-files --others --exclude-standard -- .)"
      - name: Build, vet and test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

  front-static:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/bun-install
      - run: npx nx reset:env twenty-front
      - run: npx nx run-many -t lint typecheck -p twenty-front --parallel

  front-test:
    needs: changes
    if: needs.changes.outputs.front == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/bun-install
      - run: npx nx reset:env twenty-front
      - run: npx nx test twenty-front --configuration=ci --shard=${{ matrix.shard }}/3

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/bun-install
      - run: npx nx run-many -t lint generate:check typecheck test -p twenty-ui --parallel

  shared-emails-utils:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.emails == 'true' || needs.changes.outputs.utils == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: install
        uses: ./.github/actions/bun-install
      - name: Shared lint, typecheck and test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.shared == 'true' }}
        run: npx nx run-many -t lint typecheck test -p twenty-shared --parallel
      - name: Emails build, lingui and preview
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.emails == 'true' }}
        run: |
          npx nx build twenty-emails
          npx nx run twenty-emails:lingui:extract
          npx nx run twenty-emails:lingui:compile
          npx nx run twenty-emails:start &
          SERVER_PID=$!
          sleep 20
          curl -sf http://localhost:4001/preview/test.email > /dev/null || { kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
      - name: Utils test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.changes.outputs.utils == 'true' }}
        run: npx nx test twenty-utils

  knip:
    needs: changes
    if: needs.changes.outputs.knip == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/bun-install
      - run: npx nx run-many -t knip --parallel=1

  ci-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changes, go, front-static, front-test, ui, shared-emails-utils, knip]
    steps:
      - name: Fail if any check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
